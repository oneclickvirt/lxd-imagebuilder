name: Documentation checks

on:
  - push
  - pull_request
  - workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-checks:
    uses: canonical/documentation-workflows/.github/workflows/documentation-checks.yaml@a40be455965cb08dcb48ff67042555a0f83a8de5 # main
    with:
      working-directory: 'doc'